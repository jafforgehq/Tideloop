name: CI

# Every push and pull request is tested. A push to main whose package.json version has no
# public release yet is built, signed, notarized, verified and published.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release halfway. Superseded pull request runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLIC_REPO: jafforgehq/tideloop-app
  APPLE_TEAM_ID: R9QFVTDHY5
  APPLE_ID: fedja.hadziselimovic@gmail.com

jobs:
  test:
    # Linux, because macOS minutes bill at 10x on a private repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: xvfb-run -a npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  version:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$PUBLIC_REPO/releases/tags/v$version")
          case "$code" in
            200) release=false ;;
            404) release=true ;;
            *) echo "::error::Unexpected status $code asking GitHub about v$version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, release needed: $release"
      # Here rather than in the release job, so missing secrets never burn macOS minutes.
      - name: Require signing secrets
        if: steps.check.outputs.release == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_APP_SPECIFIC_PASSWORD RELEASES_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Run scripts/setup-ci-secrets.sh, then re-run this workflow."
            exit 1
          fi
      # Also here on Linux: a token that cannot publish should fail now, not after a 10 minute macOS build.
      - name: Check the release token can publish
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          id=$(gh api -X POST "repos/$PUBLIC_REPO/releases" -f tag_name=token-check -f name="Token check" -F draft=true --jq .id) || {
            echo "::error::RELEASES_TOKEN cannot create releases on $PUBLIC_REPO. It needs Contents: Read and write on that repo. Run scripts/setup-ci-secrets.sh token."
            exit 1
          }
          gh api -X DELETE "repos/$PUBLIC_REPO/releases/$id"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # to tag the source that was released
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # No install scripts, and no secrets in this step: dependencies get no chance to read the signing key here.
      - run: npm ci --ignore-scripts
      - name: Check the release notes before spending time on a build
        run: node scripts/release-notes.mjs "$VERSION" > notes.md
      - name: Build, sign and notarize the apps
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run dist
      - name: Notarize and staple the disk images
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for dmg in dist/Tideloop-*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 45m
            xcrun stapler staple "$dmg"
          done
      - name: Refuse anything that is not properly signed and notarized
        run: scripts/verify-release.sh dist/mac/Tideloop.app dist/mac-arm64/Tideloop.app dist/Tideloop-x64.dmg dist/Tideloop-arm64.dmg
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        # Stapling changes the disk images, but the updater only reads the zip entries in latest-mac.yml.
        # Uploaded as a draft and published last, so nobody sees a half-uploaded release and a failure can retry.
        # The version job found no published release with this tag, so anything deleted here is a stale draft.
        run: |
          gh release delete "v$VERSION" --repo "$PUBLIC_REPO" --yes 2>/dev/null || true
          gh release create "v$VERSION" dist/Tideloop-*.zip dist/Tideloop-*.zip.blockmap dist/Tideloop-*.dmg dist/latest-mac.yml \
            --repo "$PUBLIC_REPO" --title "Tideloop $VERSION" --notes-file notes.md --draft
          gh release edit "v$VERSION" --repo "$PUBLIC_REPO" --draft=false
      - name: Tag the source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"

  page:
    # Runs after a successful release, and on pushes that needed no release, so page edits go live too.
    needs: [version, release]
    if: ${{ always() && needs.version.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:page
      - name: Publish the page
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: scripts/deploy-page.sh "Update page from ${GITHUB_SHA::7}"
